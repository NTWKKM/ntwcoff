name: Sync Content from Google Drive

on:
  schedule:
    # รันทุกวันเวลา 12:17 น. เวลาไทย (ICT, UTC+7) = 05:17 UTC
    # ขยับเลี่ยงนาทีที่ 0 เพื่อลดคิวสะสมและความล่าช้าของ GitHub Actions
    - cron: '17 5 * * *'
  workflow_dispatch:

concurrency:
  group: sync-gdrive
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  sync-gdrive:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Google API Dependencies
        run: pip install google-api-python-client google-auth

      - name: Download Files from Google Drive
        env:
          GDRIVE_SERVICE_ACCOUNT_KEY: ${{ secrets.GDRIVE_SERVICE_ACCOUNT_KEY }}
          GDRIVE_FOLDER_ID: ${{ secrets.GDRIVE_FOLDER_ID }}
        run: |
          if [ -z "$GDRIVE_SERVICE_ACCOUNT_KEY" ] || [ -z "$GDRIVE_FOLDER_ID" ]; then
            echo "❌ [ERROR] Missing GDRIVE_SERVICE_ACCOUNT_KEY or GDRIVE_FOLDER_ID secret." >&2
            exit 1
          fi
          python scripts/sync_drive.py

      - name: Run Content Pipeline & Auto-Tagging
        run: python scripts/prep_content.py

      - name: Commit Updated Markdown & Processed Data
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add raw_papers/ src/data/
          if ! git diff --quiet || ! git diff --staged --quiet; then
            git commit -m "chore: sync papers from Google Drive"
            git pull --rebase origin main
            git push
          fi
