name: Sync Content from Google Drive

on:
  schedule:
    # รันทุกวันเวลา 12:00 น. เวลาไทย (ICT, UTC+7) = 05:00 UTC
    - cron: '0 5 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-gdrive:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Google API Dependencies
        run: pip install google-api-python-client google-auth

      - name: Download Files from Google Drive
        env:
          GDRIVE_SERVICE_ACCOUNT_KEY: ${{ secrets.GDRIVE_SERVICE_ACCOUNT_KEY }}
          GDRIVE_FOLDER_ID: ${{ secrets.GDRIVE_FOLDER_ID }}
        run: python scripts/sync_drive.py

      - name: Run Content Pipeline & Auto-Tagging
        run: python scripts/prep_content.py

      - name: Commit Updated Markdown & Processed Data
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add raw_papers/ src/data/
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: sync papers from Google Drive" && git push)
