    <!-- Zero-FOUC Theme Script (executes before paint to prevent white flash) -->
    <script>
      (function() {
        try {
          var saved = localStorage.getItem('ntwcoff_theme');
          var isDark = saved ? saved === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches;
          if (isDark) {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
        } catch (e) {}
      })();
    </script>
    
    <!-- Google Fonts: Fraunces, Plus Jakarta Sans, Inter, Sarabun, JetBrains Mono -->
